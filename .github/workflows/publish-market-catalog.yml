name: Publish TAKwerx Market catalog

on:
  workflow_call:
    inputs:
      publisher_ref:
        description: Immutable commit SHA to check out for publisher code.
        required: true
        type: string
      catalog_target:
        description: Isolated catalog target (wearos or tracker); caller must own that host repository.
        required: false
        default: wearos
        type: string
      market_catalog_public_key:
        description: Existing Base64 Ed25519 X.509 public key.
        required: true
        type: string
    secrets:
      catalog_signing_key:
        description: Existing Ed25519 PEM signing key from the caller repository.
        required: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          repository: aegorsuch/weartak-takwerx-market
          ref: ${{ inputs.publisher_ref }}
          path: publisher
          persist-credentials: false
      - name: Test catalog publisher
        run: node --test publisher/market-publisher/tests/publish_catalog.test.mjs

  publish:
    if: github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: takwerx-market-catalog
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Validate catalog deployment target
        env:
          CATALOG_TARGET: ${{ inputs.catalog_target }}
          CALLER_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          case "$CATALOG_TARGET:$CALLER_REPOSITORY" in
            wearos:aegorsuch/weartak-wearos|tracker:aegorsuch/weartak-tracker) ;;
            *)
              echo "Catalog target does not match its approved deployment repository." >&2
              exit 1
              ;;
          esac

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          repository: aegorsuch/weartak-takwerx-market
          ref: ${{ inputs.publisher_ref }}
          path: publisher
          persist-credentials: false

      - name: Install Android APK inspection tools
        shell: bash
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager" ]]; then
            echo "Android SDK command-line tools are unavailable." >&2
            exit 1
          fi
          python3 -c 'import subprocess,sys; result=subprocess.run([sys.argv[1],"--licenses"],input=b"y\n"*100,stdout=subprocess.DEVNULL); sys.exit(result.returncode)' "$sdkmanager"
          "$sdkmanager" "build-tools;35.0.0"
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Build signed catalog
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MARKET_CATALOG_TARGET: ${{ inputs.catalog_target }}
          MARKET_CATALOG_SIGNING_KEY: ${{ secrets.catalog_signing_key }}
          MARKET_CATALOG_PUBLIC_KEY: ${{ inputs.market_catalog_public_key }}
          MARKET_OUTPUT_DIR: ${{ github.workspace }}/site
        run: node publisher/market-publisher/publish_catalog.mjs

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
